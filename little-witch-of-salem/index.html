<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Join Sabrina for a Halloween adventure in Salem, filled with costumes, candy, and a little courage. A free picture book by Anthony Baldwin, ages 4–8."><meta name="theme-color" content="#253f32"><title>The Little Witch of Salem | Little Roots Publishing</title><meta property="og:type" content="book"><meta property="og:site_name" content="Little Roots Publishing"><meta property="og:title" content="The Little Witch of Salem"><meta property="og:description" content="Join Sabrina for a Halloween adventure in Salem, filled with costumes, candy, and a little courage. A free picture book by Anthony Baldwin, ages 4–8."><meta property="og:url" content="https://littlerootspublishing.com/little-witch-of-salem/"><meta property="og:image" content="https://littlerootspublishing.com/little-witch-cover.png"><meta property="og:image:alt" content="The Little Witch of Salem book cover"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="The Little Witch of Salem"><meta name="twitter:description" content="Join Sabrina for a Halloween adventure in Salem, filled with costumes, candy, and a little courage. A free picture book by Anthony Baldwin, ages 4–8."><meta name="twitter:image" content="https://littlerootspublishing.com/little-witch-cover.png"><style>
:root{--paper:#fbf8ed;--green:#31583e;--muted:#61685e;--line:#dce0cf}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--green);font:16px/1.5 system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}a{color:inherit}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 5%;border-bottom:1px solid var(--line)}.back{text-decoration:none;font-size:14px;white-space:nowrap}h1{font:400 clamp(20px,4vw,30px)/1.1 Georgia,serif;margin:0;text-align:center}.download{font-size:13px;white-space:nowrap}main{flex:1;display:flex;flex-direction:column;align-items:center;padding:16px 12px 8px}.stage{position:relative;width:100%;max-width:900px;flex:1;display:flex;align-items:center;justify-content:center;touch-action:pan-y}canvas{max-width:100%;max-height:calc(100vh - 170px);height:auto;box-shadow:0 8px 30px #203b2926;border-radius:4px;background:#fff}.status{color:var(--muted);font-size:14px;text-align:center;padding:40px 10px}.controls{display:flex;align-items:center;justify-content:center;gap:18px;padding:12px 0 18px}.controls button{font:inherit;border:1px solid var(--green);background:var(--green);color:var(--paper);border-radius:28px;padding:10px 22px;cursor:pointer;min-width:110px}.controls button:disabled{opacity:.35;cursor:default}.count{font-size:14px;min-width:70px;text-align:center}button:focus-visible,a:focus-visible{outline:3px solid #bd6439;outline-offset:3px}@media(max-width:600px){header{padding:12px 16px}.controls{gap:10px}.controls button{min-width:90px;padding:10px 16px}}
</style></head><body><header><a class="back" href="../#books">← Little Roots</a><h1>The Little Witch of Salem</h1><a class="download" href="../little-witch-of-salem.pdf" download>Download PDF</a></header><main><div class="stage" id="stage"><p class="status" id="status">Opening the book…</p><canvas id="page" hidden aria-label="Book page"></canvas></div><div class="controls"><button id="prev" disabled aria-label="Previous page">← Back</button><span class="count" id="count" aria-live="polite"></span><button id="next" disabled aria-label="Next page">Next →</button></div></main><script src="../assets/pdfjs/pdf.min.js"></script><script>
pdfjsLib.GlobalWorkerOptions.workerSrc='../assets/pdfjs/pdf.worker.min.js';
const canvas=document.getElementById('page'),status=document.getElementById('status'),count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next'),stage=document.getElementById('stage');
let doc=null,num=1,rendering=null;
function render(n){
  num=n;prev.disabled=n<=1;next.disabled=n>=doc.numPages;count.textContent=n+' / '+doc.numPages;
  if(rendering)rendering.cancel();
  doc.getPage(n).then(page=>{
    const base=page.getViewport({scale:1}),maxW=stage.clientWidth,maxH=window.innerHeight-170;
    const scale=Math.min(maxW/base.width,maxH/base.height),dpr=Math.min(window.devicePixelRatio||1,3);
    const vp=page.getViewport({scale:scale*dpr});
    canvas.width=vp.width;canvas.height=vp.height;canvas.style.width=(vp.width/dpr)+'px';
    rendering=page.render({canvasContext:canvas.getContext('2d'),viewport:vp});
    return rendering.promise;
  }).then(()=>{rendering=null;canvas.hidden=false;status.hidden=true;if(n<doc.numPages)doc.getPage(n+1)}).catch(e=>{if(e&&e.name!=='RenderingCancelledException')throw e});
}
function go(d){if(doc){const n=num+d;if(n>=1&&n<=doc.numPages)render(n)}}
prev.onclick=()=>go(-1);next.onclick=()=>go(1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});
let sx=null;stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
stage.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)go(dx<0?1:-1);sx=null});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>doc&&render(num),200)});
pdfjsLib.getDocument('../little-witch-of-salem.pdf').promise.then(d=>{doc=d;render(1)}).catch(()=>{status.innerHTML='Sorry, the book could not be opened here. <a href="../little-witch-of-salem.pdf">Open the PDF instead</a>.'});
</script></body></html>
